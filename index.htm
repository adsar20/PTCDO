<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Provincial Training Center - Davao Oriental Enrollment Monitoring System</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- SHEET JS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/icon/logo1.png" class="logo-icon" />
                <span class="logo-text">PTCDO EMS</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <!-- <i class="bi bi-list"></i> -->
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="index.htm" class="nav-item active">
                <i class="nav-icon bi bi-upload"></i>
                <span class="nav-label">Import</span>
            </a>
            <a href="dashboard.html" class="nav-item">
                <i class="nav-icon bi bi-bar-chart-line-fill"></i>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="Calendar.html" class="nav-item">
                <i class="nav-icon bi bi-calendar4-week"></i>
                <span class="nav-label">Calendar</span>
            </a>
            <a href="trainers.html" class="nav-item">
                <i class="nav-icon bi bi-person-badge"></i>
                <span class="nav-label">Trainers</span>
            </a>
        </nav>

        <!-- Dark Mode Toggle at Bottom -->
        <div class="sidebar-theme-toggle">
            <div class="theme-toggle">
                <label class="theme-switch">
                    <input type="checkbox" id="sidebarThemeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-label">Dark Mode</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="container">

             <!-- TOPBAR -->

             <div class="topbar">

                 <button class="sidebar-toggle-topbar" id="sidebarToggleTopbar" title="Toggle sidebar">

                     <i class="bi bi-list"></i>

                 </button>

                 <div class="title">
                    <h1>Excel Import Dashboard</h1>
                    <p>Upload Excel files and save directly to DataBase</p>
                </div>

                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>

            </div>

            <!-- LOADING OVERLAY -->
            <div class="loading-overlay" id="loadingOverlay">
              <div class="loader-card">
                <div class="spinner"></div>
                <p class="loader-text">Uploading to Database...</p>
                <div class="loader-dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>

            <!-- UPLOAD -->

            <div class="card card-accent-blue">

<div class="card-header">
    <h3>📊 Import Data</h3>
     <span class="badge" id="fileBadge">No file selected</span>
</div>

                <label class="upload-box" for="fileInput">

                    <div class="upload-icon">📈</div>

                    <h2>Drag & Drop or Click to Upload</h2>

                    <p>Supports .xlsx and .xls files</p>

                    <button class="btn" id="chooseFileBtn" type="button">
                        Choose File
                    </button>

                </label>

                <input type="file" id="fileInput" accept=".xlsx,.xls">

                <div class="bottom-actions">

                    <button class="btn" id="uploadFirebaseBtn" disabled>
                        Upload to Database
                    </button>

                    <p class="status-text" id="statusMessage">
                        Waiting for Database connection...
                    </p>

                </div>

            </div>

            <!-- STATS & TABLE ROW -->

            <div class="main-row">

                <!-- TABLE -->

                <div class="card table-container card-accent-blue">

                    <div class="card-header">
                        <h3>📄 Trainee Data Table</h3>
                    </div>

                    <table id="excelTable">

                        <thead></thead>

                        <tbody></tbody>

                    </table>

                </div>

                <!-- STATS -->

                <div class="stats">

                    <div class="stat-card">
                        <div class="card-header">
                            <h3>📋 Total Rows</h3>
                        </div>
                        <h1 id="rowCount">0</h1>
                    </div>

                    <div class="stat-card">
                        <div class="card-header">
                            <h3>📑 Total Columns</h3>
                        </div>
                        <h1 id="columnCount">0</h1>
                    </div>

                </div>

            </div>

            <!-- This closes the .container div -->
        </div>

    </main>

     <!-- FIREBASE -->
     <script type="module" src="js/index.js"></script>
     <script type="module" src="js/sidebar.js"></script>

</body>

</html>
